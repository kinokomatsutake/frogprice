<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17251e">
<title>frogprice — Cardmarket price guide</title>
<style>
:root{color-scheme:dark;--bg:#101813;--panel:#1a2820;--text:#edf5ed;--muted:#a8b8ac;--accent:#a6d68c;--line:#314338}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
header{padding:24px max(18px,calc((100vw - 1200px)/2));background:#17251e;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.8rem}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:20px 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}
input{flex:1;min-width:180px}.summary{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card img{display:block;width:100%;aspect-ratio:488/680;object-fit:cover;background:#25352a}
.card-info{padding:10px}.name{font-weight:650;overflow-wrap:anywhere;font-size:.94rem}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.price{background:#223329;border-radius:7px;padding:7px;font-size:.78rem;color:var(--muted)}
.price b{display:block;color:var(--accent);font-size:.98rem;font-variant-numeric:tabular-nums}
.status{margin-top:8px;font-size:.74rem;color:var(--muted)}
a{color:var(--accent)}footer{max-width:1200px;margin:28px auto;padding:0 16px 30px;color:var(--muted);font-size:.82rem}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
</style>
</head>
<body>
<header><h1>🐸 frogprice</h1><p>Magic: The Gathering · Cardmarket Price Guide · EUR</p></header>
<main>
<div class="toolbar">
<input id="search" type="search" placeholder="Search cards…" aria-label="Search cards">
<select id="filter" aria-label="Filter price status"><option value="all">All cards</option><option value="matched">Matched prices</option><option value="unmatched">Not matched</option></select>
</div>
<p class="summary" id="summary">Loading collection…</p>
<section class="grid" id="grid" aria-live="polite"></section>
</main>
<footer>Average and Low are Cardmarket Price Guide values, not guaranteed live listing prices. Prices are in EUR. Exact-printing matches only; unverified cards are labelled Not matched.</footer>
<script>
const euro = n => Number.isFinite(Number(n)) ? new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n)) : '—';
const titleFromPath = p => decodeURIComponent(p.split('/').pop().replace(/\.[^.]+$/,'')).replace(/[_-]+/g,' ');
async function load(){
 const [images,prices]=await Promise.all([
  fetch('./images.json').then(r=>{if(!r.ok)throw Error('images.json missing');return r.json()}),
  fetch('./prices.json').then(r=>r.ok?r.json():{})
 ]);
 const grid=document.querySelector('#grid'),search=document.querySelector('#search'),filter=document.querySelector('#filter');
 const render=()=>{
  const q=search.value.trim().toLowerCase(),f=filter.value;
  const rows=images.filter(p=>titleFromPath(p).toLowerCase().includes(q)).filter(p=>f==='all'||(f==='matched'?!!prices[p]?.matched:!prices[p]?.matched));
  grid.replaceChildren();
  for(const path of rows){
   const item=prices[path]||{},card=document.createElement('article');card.className='card';
   const img=document.createElement('img');img.src='https://raw.githubusercontent.com/kinokomatsutake/picture-checklist/main/'+path.split('/').map(encodeURIComponent).join('/');img.alt=titleFromPath(path);img.loading='lazy';img.onerror=()=>{img.alt='Image unavailable';img.style.minHeight='180px'};
   const info=document.createElement('div');info.className='card-info';
   const name=document.createElement('div');name.className='name';name.textContent=item.name||titleFromPath(path);
   const vals=document.createElement('div');vals.className='prices';
   for(const [label,value] of [['Average',item.average],['Low',item.low]]){const box=document.createElement('div');box.className='price';box.append(document.createTextNode(label));const b=document.createElement('b');b.textContent=item.matched?euro(value):'—';box.append(b);vals.append(box)}
   const status=document.createElement('div');status.className='status';status.textContent=item.matched?'Exact product mapped'+(item.printing?' · '+item.printing:''):'Not matched — needs printing verification';
   info.append(name,vals,status);card.append(img,info);grid.append(card);
  }
  const matched=images.filter(p=>prices[p]?.matched).length;
  document.querySelector('#summary').textContent=rows.length+' shown · '+images.length+' images total · '+matched+' with verified product mappings';
 };
 search.addEventListener('input',render);filter.addEventListener('change',render);render();
}
load().catch(e=>{document.querySelector('#summary').textContent='Could not load collection: '+e.message});
</script>
</body></html>
