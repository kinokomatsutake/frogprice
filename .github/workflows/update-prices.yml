name: Update Cardmarket guide prices
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cardmarket-mapping.json"
      - "images.json"
      - "scripts/update_prices.py"
      - ".github/workflows/update-prices.yml"
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate price guide
        run: python scripts/update_prices.py
      - name: Commit refreshed prices
        run: |
          if git diff --quiet -- prices.json; then
            echo "No price changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json
            git commit -m "Update Cardmarket price guide"
            git push
          fi
